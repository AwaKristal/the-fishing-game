<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Fishing Game</title>
  <!-- Firebase App (Core) SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <!-- Firebase Auth & Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto 20px auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #00adb5;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #00818a;
    }
    button:disabled {
      background: #444;
      cursor: not-allowed;
    }
    
    /* Contenedor de Noticias (Carrusel) */
    .news-card {
      background: #2a2a2a;
      border-radius: 6px;
      padding: 15px;
      border-left: 4px solid #00adb5;
      margin-top: 10px;
    }
    .news-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      gap: 10px;
    }
    .news-controls button {
      width: auto;
      padding: 8px 15px;
    }
    .news-counter {
      font-weight: bold;
      color: #00adb5;
    }

    /* Botón de Admin flotante */
    .admin-trigger-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background-color: #2c3e50;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .admin-trigger-btn img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    /* Modal de Admin */
    .admin-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #222;
      border: 1px solid #444;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.7);
      z-index: 10000;
      width: 90%;
      max-width: 450px;
      border-radius: 8px;
    }
    hr {
      border: 0;
      border-top: 1px solid #444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>The Fishing Game</h1>
    
    <!-- Sección de Autenticación / Perfil -->
    <div id="auth-section">
      <h3>Acceso</h3>
      <input type="email" id="userEmail" placeholder="Correo electrónico">
      <input type="password" id="userPassword" placeholder="Contraseña">
      <button onclick="loginUser()">Iniciar Sesión</button>
      <button onclick="registerUser()">Registrarse</button>
      <button onclick="sendPasswordReset()">Olvidé mi contraseña</button>
    </div>

    <div id="profile-section" style="display:none;">
      <h3>Perfil de Usuario</h3>
      <p id="profile-info"></p>
      <button onclick="resendVerificationEmail()">Reenviar Correo de Verificación</button>
      <button onclick="logoutUser()">Cerrar Sesión</button>
    </div>

    <hr>

    <!-- Búsqueda de Usuarios -->
    <div>
      <h3>Buscar Jugador</h3>
      <input type="text" id="searchUsernameInput" placeholder="Nombre de usuario exacto">
      <button onclick="handleUserSearch()">Buscar</button>
      <div id="searchResult" style="margin-top: 10px; background: #2a2a2a; padding: 10px; border-radius: 4px; display:none;"></div>
    </div>
  </div>

  <!-- Sección de Noticias (Con Navegación y Contador) -->
  <div class="container">
    <h2>Noticias del Juego</h2>
    <div id="newsFeed">Cargando noticias...</div>
    
    <div class="news-controls" id="newsControls" style="display: none;">
      <button id="prevNewsBtn" onclick="changeNews(-1)">◀ Anterior</button>
      <span class="news-counter" id="newsCounter">0 / 0</span>
      <button id="nextNewsBtn" onclick="changeNews(1)">Siguiente ▶</button>
    </div>
  </div>

  <!-- Botón Admin (Esquina flotante) -->
  <button id="adminBtn" class="admin-trigger-btn" onclick="openAdminPanel()">
    <img src="https://i.postimg.cc/L6SrYVZf/admin.png" alt="Admin Panel">
  </button>

  <!-- Modal del Panel de Administración -->
  <div id="adminModal" class="admin-modal">
    <h3>Panel de Administración</h3>
    
    <div>
      <h4>Gestionar Usuario</h4>
      <input type="text" id="adminTargetUid" placeholder="UID del Usuario">
      
      <div style="display: flex; gap: 5px; margin-top: 5px;">
        <button onclick="adminBanUser(true)" style="background: #d9534f;">Ban</button>
        <button onclick="adminBanUser(false)" style="background: #5cb85c;">Unban</button>
        <button onclick="adminTempBan()" style="background: #f0ad4e;">Temp Ban</button>
      </div>
      
      <div style="margin-top: 10px;">
        <input type="number" id="adminCoinsAmount" placeholder="Cantidad de Coins">
        <div style="display: flex; gap: 5px;">
          <button onclick="adminModifyCoins(1)">Dar Coins</button>
          <button onclick="adminModifyCoins(-1)" style="background: #d9534f;">Quitar Coins</button>
        </div>
      </div>
    </div>

    <hr>

    <div>
      <h4>Publicar Noticia</h4>
      <input type="text" id="newsTitle" placeholder="Título">
      <textarea id="newsContent" placeholder="Contenido de la noticia" rows="3"></textarea>
      <input type="file" id="newsImage" accept="image/*">
      <button onclick="adminPostNews()">Publicar Noticia</button>
    </div>
    
    <br>
    <button onclick="closeAdminPanel()" style="background: #555;">Cerrar Panel</button>
  </div>

  <script>
    // Configuración de Firebase (Reemplaza con tus credenciales si faltan)
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "the-fishing-game-digitalized.firebaseapp.com",
      projectId: "the-fishing-game-digitalized",
      storageBucket: "the-fishing-game-digitalized.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const ADMIN_UID = "09SjiwOt9fYdFbc1wQp17Ot467F2";

    // Variables globales para el visor de noticias
    let newsList = [];
    let currentNewsIndex = 0;

    // Estado de sesión
    auth.onAuthStateChanged(user => {
      const adminBtn = document.getElementById('adminBtn');
      if (user) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('profile-section').style.display = 'block';
        document.getElementById('profile-info').innerHTML = `Email: ${user.email} <br> Verificado: ${user.emailVerified ? 'Sí' : 'No'}`;

        if (user.uid === ADMIN_UID) {
          adminBtn.style.display = 'flex';
        } else {
          adminBtn.style.display = 'none';
        }
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('profile-section').style.display = 'none';
        adminBtn.style.display = 'none';
      }
    });

    async function registerUser() {
      const email = document.getElementById('userEmail').value;
      const password = document.getElementById('userPassword').value;
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await cred.user.sendEmailVerification();
        await db.collection('users').doc(cred.user.uid).set({
          email: email,
          username: email.split('@')[0],
          coins: 100,
          isBanned: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('¡Registro exitoso! Revisa tu correo para verificar tu cuenta.');
      } catch (error) {
        alert('Error en registro: ' + error.message);
      }
    }

    async function loginUser() {
      const email = document.getElementById('userEmail').value;
      const password = document.getElementById('userPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        alert('Error al iniciar sesión: ' + error.message);
      }
    }

    async function logoutUser() {
      await auth.signOut();
    }

    async function resendVerificationEmail() {
      const user = auth.currentUser;
      if (user) {
        try {
          await user.sendEmailVerification();
          alert('¡Correo de verificación reenviado!');
        } catch (error) {
          alert('Error al reenviar: ' + error.message);
        }
      }
    }

    async function sendPasswordReset() {
      const email = document.getElementById('userEmail').value;
      if (!email) return alert('Ingresa tu correo para restablecer la contraseña.');
      try {
        await auth.sendPasswordResetEmail(email);
        alert('Correo de restablecimiento enviado.');
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    // Búsqueda de usuarios
    async function handleUserSearch() {
      const searchTerm = document.getElementById('searchUsernameInput').value.trim();
      const resultDiv = document.getElementById('searchResult');
      if (!searchTerm) return;

      const snapshot = await db.collection('users').where('username', '==', searchTerm).get();
      if (snapshot.empty) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'No se encontró ningún usuario.';
        return;
      }

      snapshot.forEach(doc => {
        const data = doc.data();
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<strong>Usuario:</strong> ${data.username}<br><strong>Coins:</strong> ${data.coins || 0}`;
      });
    }

    // --- Sistema de Noticias con Botones y Contador ---
    function listenToNews() {
      db.collection('news')
        .orderBy('createdAt', 'desc')
        .onSnapshot(snapshot => {
          newsList = [];
          snapshot.forEach(doc => {
            newsList.push(doc.data());
          });

          if (newsList.length === 0) {
            document.getElementById('newsFeed').innerHTML = '<p>No hay noticias publicadas.</p>';
            document.getElementById('newsControls').style.display = 'none';
            return;
          }

          document.getElementById('newsControls').style.display = 'flex';
          currentNewsIndex = 0;
          renderCurrentNews();
        });
    }

    function renderCurrentNews() {
      const newsFeed = document.getElementById('newsFeed');
      const newsCounter = document.getElementById('newsCounter');
      const prevBtn = document.getElementById('prevNewsBtn');
      const nextBtn = document.getElementById('nextNewsBtn');

      const news = newsList[currentNewsIndex];
      const date = news.createdAt ? news.createdAt.toDate().toLocaleDateString() : '';

      newsFeed.innerHTML = `
        <div class="news-card">
          <h3 style="margin-top:0;">${news.title}</h3>
          <small style="color: #aaa;">${date}</small>
          <p style="white-space: pre-line;">${news.content}</p>
          ${news.imageUrl ? `<img src="${news.imageUrl}" style="max-width: 100%; border-radius: 4px; margin-top: 10px;">` : ''}
        </div>
      `;

      // Actualizar contador (ejemplo: 1 / 4)
      newsCounter.textContent = `${currentNewsIndex + 1} / ${newsList.length}`;

      // Activar / Desactivar botones según los límites
      prevBtn.disabled = (currentNewsIndex === 0);
      nextBtn.disabled = (currentNewsIndex === newsList.length - 1);
    }

    function changeNews(direction) {
      currentNewsIndex += direction;
      renderCurrentNews();
    }

    listenToNews();

    // --- Panel de Admin ---
    function openAdminPanel() { document.getElementById('adminModal').style.display = 'block'; }
    function closeAdminPanel() { document.getElementById('adminModal').style.display = 'none'; }

    async function adminBanUser(isBanned) {
      const targetUid = document.getElementById('adminTargetUid').value.trim();
      if (!targetUid) return alert('Ingresa un UID');
      await db.collection('users').doc(targetUid).update({ isBanned });
      alert(`Usuario ${isBanned ? 'baneado' : 'desbaneado'} correctamente.`);
    }

    async function adminTempBan() {
      const targetUid = document.getElementById('adminTargetUid').value.trim();
      const hours = prompt("¿Cuántas horas de ban temporal?");
      if (!targetUid || !hours) return;
      const unbanDate = new Date(Date.now() + hours * 3600000);
      await db.collection('users').doc(targetUid).update({ tempBanUntil: unbanDate });
      alert(`Ban temporal aplicado hasta: ${unbanDate.toLocaleString()}`);
    }

    async function adminModifyCoins(multiplier) {
      const targetUid = document.getElementById('adminTargetUid').value.trim();
      const amount = parseInt(document.getElementById('adminCoinsAmount').value);
      if (!targetUid || isNaN(amount)) return alert('Ingresa UID y cantidad válidos');
      const val = amount * multiplier;
      await db.collection('users').doc(targetUid).update({
        coins: firebase.firestore.FieldValue.increment(val)
      });
      alert(`Monedas actualizadas (${val > 0 ? '+' : ''}${val})`);
    }

    async function adminPostNews() {
      const title = document.getElementById('newsTitle').value.trim();
      const content = document.getElementById('newsContent').value.trim();
      const imageFile = document.getElementById('newsImage').files[0];

      if (!title || !content) return alert('Título y contenido requeridos');

      let imageBase64 = null;
      if (imageFile) {
        if (imageFile.size > 1048576) return alert('La imagen excede el límite máximo de 1MB.');
        imageBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(imageFile);
        });
      }

      await db.collection('news').add({
        title, content, imageUrl: imageBase64,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert('Noticia publicada exitosamente');
      closeAdminPanel();
    }
  </script>
</body>
</html>
